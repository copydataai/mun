<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mun model discovery prototype</title>
  <style>
    :root{color-scheme:dark;--bg:#101211;--panel:#181b19;--line:#303531;--muted:#9ca69f;--text:#f3f6f3;--accent:#b7f34a;--warn:#ffcf67;--bad:#ff8c82;font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)} button,input,select{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .shell{max-width:1240px;margin:auto;padding:34px 30px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.brand{font-size:20px;font-weight:800;letter-spacing:-.03em}.brand i{color:var(--accent);font-style:normal}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.muted{color:var(--muted)}h1{font-size:clamp(34px,5vw,67px);line-height:1;letter-spacing:-.055em;margin:10px 0 16px;max-width:900px}h2,h3,p{margin-top:0}.lede{font-size:18px;max-width:660px}.btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:7px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#10130d}.btn:disabled{opacity:.45;cursor:not-allowed}.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:12px;color:var(--muted)}.tag.good{color:var(--accent);border-color:#63852c}.tag.warn{color:var(--warn);border-color:#775f2b}.grid{display:grid;gap:18px}.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}.facts strong{color:var(--text)}
    .notice{border-left:3px solid var(--accent);padding:12px 16px;background:#171b16;color:var(--muted);margin:24px 0}.notice strong{color:var(--text)}
    /* A: guided shortlist */
    .device{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:16px 0;margin-bottom:25px}.recommend{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:34px 0}.score{font-size:72px;line-height:1;font-weight:800;color:var(--accent);letter-spacing:-.06em}.meter{height:6px;background:#2b302c;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}.alternatives{grid-template-columns:repeat(3,1fr);margin-top:30px}.alt{padding-top:16px;border-top:1px solid var(--line)}
    /* B: library */
    .library{display:grid;grid-template-columns:minmax(540px,1fr) 350px;border:1px solid var(--line);min-height:610px}.catalog{border-right:1px solid var(--line)}.toolbar{display:flex;gap:10px;padding:16px;border-bottom:1px solid var(--line)}.toolbar input{flex:1}.input{background:#0d0f0e;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 11px}.model-row{display:grid;grid-template-columns:1.6fr .7fr .7fr .6fr;gap:8px;padding:15px 16px;border-bottom:1px solid #252925;align-items:center}.model-row[role=button]:hover,.model-row.selected{background:#1d221d}.model-row.selected{box-shadow:inset 3px 0 var(--accent)}.model-row small{display:block;color:var(--muted)}.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.inspector{padding:25px;position:sticky;top:0;height:max-content}.inspector h2{font-size:26px;overflow-wrap:anywhere}.inspect-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:22px 0}.inspect-grid small{display:block;color:var(--muted)}
    /* C: task first */
    .wizard{max-width:880px;margin:0 auto}.step{display:grid;grid-template-columns:120px 1fr;gap:24px;padding:27px 0;border-top:1px solid var(--line)}.step-no{color:var(--muted);font-size:13px}.choices{display:flex;gap:9px;flex-wrap:wrap}.choice{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:99px;padding:9px 14px}.choice.active{background:var(--accent);color:#10130d;border-color:var(--accent);font-weight:800}.answer{margin-top:28px;padding:30px;border:1px solid var(--accent);display:grid;grid-template-columns:1fr auto;gap:28px}.answer h2{font-size:32px;letter-spacing:-.04em}.cli{background:#090a09;border:1px solid var(--line);border-radius:6px;padding:13px;color:#c9d0ca;overflow:auto;font:12px/1.5 ui-monospace,monospace}
    .switcher{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:#f3f6f3;color:#111;border-radius:99px;padding:6px;box-shadow:0 12px 35px #0009}.switcher button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;font-size:18px}.switcher button:hover{background:#dfe4df}.switcher span{min-width:230px;text-align:center;font-weight:800}.ribbon{position:fixed;right:18px;top:16px;z-index:8;color:var(--warn);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.toast{position:fixed;right:24px;bottom:85px;background:var(--accent);color:#111;padding:12px 16px;border-radius:6px;font-weight:800;transform:translateY(15px);opacity:0;transition:.2s}.toast.show{opacity:1;transform:none}.state{position:fixed;left:15px;bottom:16px;z-index:7;font-size:11px;color:var(--muted)}.state pre{max-width:360px;background:#090a09;border:1px solid var(--line);padding:10px;white-space:pre-wrap}.hidden{display:none!important}
    @media(max-width:800px){.shell{padding:24px 18px 100px}.recommend,.answer{grid-template-columns:1fr}.alternatives{grid-template-columns:1fr}.library{grid-template-columns:1fr}.catalog{border-right:0}.inspector{border-top:1px solid var(--line)}.model-row{grid-template-columns:1.5fr .7fr}.model-row>*:nth-child(n+3){display:none}.step{grid-template-columns:1fr;gap:8px}.ribbon,.state{display:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="ribbon">Prototype · nothing downloads</div>
  <main class="shell" id="app"></main>
  <details class="state"><summary>Prototype state</summary><pre id="state"></pre></details>
  <nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant-label"></span><button id="next" aria-label="Next variant">→</button></nav>
  <div class="toast" role="status" id="toast">Added to install queue</div>
  <script>
    const models=[
      {id:'openai/whisper-large-v3-turbo',label:'Whisper Large v3 Turbo',runtime:'Transformers',device:'Apple · NVIDIA · AMD · CPU',precision:'FP16',disk:'1.6 GB',memory:'~3.2 GB',speed:'0.18× realtime',license:'MIT',status:'Eligible',note:'Best quality for multilingual transcription and English translation.'},
      {id:'distil-whisper/distil-large-v3',label:'Distil-Whisper Large v3',runtime:'Transformers',device:'NVIDIA · CPU',precision:'FP16',disk:'1.5 GB',memory:'~3.0 GB',speed:'Not measured',license:'MIT',status:'Eligible',note:'Fast English-only model. Not suitable for multilingual work.'},
      {id:'Systran/faster-whisper-small',label:'Faster Whisper Small',runtime:'faster-whisper',device:'NVIDIA · CPU',precision:'INT8',disk:'967 MB',memory:'~1.5 GB',speed:'0.09× realtime',license:'MIT',status:'Installed',note:'Compact local option with low memory use.'},
      {id:'facebook/wav2vec2-base-960h',label:'Wav2Vec2 Base 960h',runtime:'Transformers',device:'Apple · NVIDIA · AMD · CPU',precision:'FP32',disk:'378 MB',memory:'~900 MB',speed:'Not measured',license:'Apache-2.0',status:'Eligible',note:'English transcription only; no translation.'},
      {id:'pyannote/speaker-diarization-community-1',label:'Community-1 Diarization',runtime:'pyannote',device:'CPU',precision:'FP32',disk:'1.2 GB',memory:'~2.0 GB',speed:'Not measured',license:'CC-BY-4.0',status:'Gated',note:'Optional speaker detection pack. Requires accepting model terms.'}
    ];
    const state={variant:'A',selected:models[0].id,task:'Transcribe',language:'Auto-detect',priority:'Balanced',query:''};
    const names={A:'A · Guided shortlist',B:'B · Model library',C:'C · Task-first setup'};
    const app=document.querySelector('#app');
    function headerMarkup(){return `<header class="top"><div class="brand">mun<i>.</i></div><button class="btn" data-action="installed">Installed models · 1</button></header>`}
    function tags(m){return `<div class="facts"><span class="tag ${m.status==='Installed'?'good':m.status==='Gated'?'warn':''}">${m.status}</span><span><strong>${m.disk}</strong> disk</span><span><strong>${m.memory}</strong> memory</span><span><strong>${m.speed}</strong></span></div>`}
    function variantA(){return `${headerMarkup()}<section><div class="eyebrow">Model setup</div><h1>One good choice,<br>without the guesswork.</h1><p class="lede muted">Mun checked this Mac and picked a multilingual model that fits comfortably. Change it only if you need to.</p><div class="device"><span><strong>Apple M4</strong><br><small class="muted">24 GB unified memory · Metal acceleration</small></span><button class="btn">Check again</button></div><div class="recommend"><div><span class="tag good">Recommended for this Mac</span><h2 style="font-size:34px;margin:14px 0 9px">Whisper Large v3 Turbo</h2><p class="muted">High-quality transcription in 99 languages, timestamps, language detection, and English translation.</p>${tags(models[0])}<p style="margin-top:24px"><button class="btn primary" data-action="install">Install model · 1.6 GB</button> <button class="btn" data-action="details">See details</button></p></div><div><div class="score">92</div><p><strong>Excellent fit</strong><br><span class="muted">Estimated from model size and available memory. Speed has not been verified on this exact Mac.</span></p><div class="meter"><i style="width:92%"></i></div><p class="notice"><strong>Evidence, clearly labeled.</strong><br>“Eligible” means the model should work. “Tested” appears only after Mun validates this exact model, runtime, device, and precision.</p></div></div><h2 style="margin-top:38px">Other sensible choices</h2><div class="grid alternatives">${models.slice(1,4).map(m=>`<article class="alt"><span class="tag">${m.precision}</span><h3 style="margin:12px 0 6px">${m.label}</h3><p class="muted">${m.note}</p>${tags(m)}</article>`).join('')}</div></section>`}
    function rows(){return models.filter(m=>(m.label+' '+m.id+' '+m.runtime).toLowerCase().includes(state.query.toLowerCase())).map(m=>`<div class="model-row ${state.selected===m.id?'selected':''}" role="button" tabindex="0" data-model="${m.id}"><div><strong>${m.label}</strong><small>${m.id}</small></div><div>${m.runtime}<small>${m.precision}</small></div><div>${m.disk}<small>${m.memory} RAM</small></div><div><span class="tag ${m.status==='Installed'?'good':m.status==='Gated'?'warn':''}">${m.status}</span></div></div>`).join('')||`<p class="muted" style="padding:30px">No models match this search.</p>`}
    function variantB(){const m=models.find(x=>x.id===state.selected)||models[0];return `${headerMarkup()}<div class="eyebrow">Model library</div><h1 style="font-size:48px">Find the right local engine.</h1><p class="lede muted">Search compatible Hugging Face models and Mun runtimes. Metadata helps discovery; installation is verified only when the model loads.</p><section class="library"><div class="catalog"><div class="toolbar"><input class="input" id="search" aria-label="Search models" placeholder="Search models or runtimes" value="${state.query}"><select class="input" aria-label="Device filter"><option>This Mac</option><option>All devices</option></select></div><div class="model-row head"><div>Model</div><div>Runtime</div><div>Resources</div><div>Status</div></div><div id="rows">${rows()}</div></div><aside class="inspector"><span class="tag ${m.status==='Installed'?'good':m.status==='Gated'?'warn':''}">${m.status}</span><h2>${m.label}</h2><p class="muted">${m.note}</p><div class="inspect-grid"><div><small>Disk</small><strong>${m.disk}</strong></div><div><small>Memory</small><strong>${m.memory}</strong></div><div><small>Precision</small><strong>${m.precision}</strong></div><div><small>License</small><strong>${m.license}</strong></div></div><p><small class="muted">COMPATIBLE DEVICES</small><br>${m.device}</p><p><small class="muted">SPEED EVIDENCE</small><br>${m.speed}</p><button class="btn primary" data-action="install">${m.status==='Installed'?'Installed':'Install model'}</button><pre class="cli">mun models install ${m.id}</pre></aside></section>`}
    function choices(group,items){return `<div class="choices">${items.map(x=>`<button class="choice ${state[group]===x?'active':''}" data-group="${group}" data-value="${x}">${x}</button>`).join('')}</div>`}
    function variantC(){return `${headerMarkup()}<section class="wizard"><div class="eyebrow">Quick setup</div><h1>Tell Mun what matters.</h1><p class="lede muted">Answer three plain questions. Mun will choose a model you can change later.</p><div class="step"><div class="step-no">01 · Job</div><div><h2>What do you need?</h2>${choices('task',['Transcribe','Translate to English','Identify speakers'])}</div></div><div class="step"><div class="step-no">02 · Audio</div><div><h2>Which language?</h2>${choices('language',['Auto-detect','English','Spanish','Multilingual'])}</div></div><div class="step"><div class="step-no">03 · Tradeoff</div><div><h2>What matters most?</h2>${choices('priority',['Balanced','Best accuracy','Lowest memory','Fastest'])}</div></div><div class="answer"><div><span class="tag good">Your match</span><h2>Whisper Large v3 Turbo</h2><p class="muted">Fits this Mac, supports ${state.language.toLowerCase()} audio, and balances quality with speed. Estimated 1.6 GB download.</p><button class="btn primary" data-action="install">Use this model</button> <button class="btn" data-action="browse">Compare all</button></div><div><div class="score">92</div><small class="muted">fit score</small></div></div><pre class="cli">mun models recommend --task "${state.task}" --language "${state.language}" --priority "${state.priority}"</pre></section>`}
    function render(){const q=new URLSearchParams(location.search).get('variant')?.toUpperCase();if(names[q])state.variant=q;app.innerHTML=state.variant==='A'?variantA():state.variant==='B'?variantB():variantC();document.querySelector('#variant-label').textContent=names[state.variant];document.querySelector('#state').textContent=JSON.stringify(state,null,2);bind()}
    function setVariant(v){state.variant=v;history.replaceState({},'',`?variant=${v}`);render()}
    function move(n){const keys=Object.keys(names),i=keys.indexOf(state.variant);setVariant(keys[(i+n+keys.length)%keys.length])}
    function bind(){document.querySelectorAll('[data-model]').forEach(el=>{const pick=()=>{state.selected=el.dataset.model;render()};el.onclick=pick;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}}});document.querySelectorAll('[data-group]').forEach(el=>el.onclick=()=>{state[el.dataset.group]=el.dataset.value;render()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{if(el.dataset.action==='details'||el.dataset.action==='browse')setVariant('B');else if(el.dataset.action==='install'){const t=document.querySelector('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}});const search=document.querySelector('#search');if(search)search.oninput=e=>{state.query=e.target.value;document.querySelector('#rows').innerHTML=rows();bind()}}
    document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});render();
  </script>
</body>
</html>
