[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mun"
version = "0.1.0"
description = "Local-first batch speech-to-text from Hugging Face models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [{ name = "Mun contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "huggingface-hub>=0.34,<2",
  "torch>=2.2,<3",
  "transformers>=5.14,<6",
]


[project.scripts]
mun = "mun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mun"]

[tool.hatch.build.targets.sdist]
include = ["src/mun", "tests", "README.md", "LICENSE", "CONTEXT.md", "pyproject.toml"]
